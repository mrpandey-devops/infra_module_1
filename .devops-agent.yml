name: DevOps Agent

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  devops-check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read DevOps Agent Configuration
        run: |
          echo "===== DEVOPS AGENT CONFIGURATION ====="
          cat .devops-agent.yml
          echo "======================================="

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: |
          tflint --init
          tflint

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .

      - name: Pipeline Complete
        run: |
          echo "================================"
          echo "🤖 DEVOPS AGENT CHECK COMPLETE"
          echo "================================"
